name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Build and Run Unit Tests (Qt6)
    runs-on: ubuntu-22.04
    container: linuxdeepin/deepin:crimson

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup apt sources
        run: |
          set -euxo pipefail
          echo "deb [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" > /etc/apt/sources.list
          echo "deb-src [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" >> /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d
          apt-get update

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          apt-get install -y --no-install-recommends \
            build-essential g++ \
            devscripts equivs git cmake pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev \
            libdtkcommon-dev libdtk6log-dev \
            libgtest-dev \
            libicu-dev libuchardet-dev libdbus-1-dev

      - name: Configure (Qt6)
        run: cmake -B build -DBUILD_TESTING=ON -DDTK5=OFF

      - name: Build tests
        run: cmake --build build -- -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure